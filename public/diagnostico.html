<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GymTracker — Diagnóstico</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 24px 16px; }
    header { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
    header a { color: #64748b; text-decoration: none; font-size: 0.85rem; border: 1px solid #334155; padding: 4px 10px; border-radius: 6px; }
    header a:hover { color: #cbd5e1; }
    h1 { font-size: 1.25rem; font-weight: 600; }
    .subtitle { color: #64748b; font-size: 0.8rem; margin-top: 2px; }
    #refresh-info { margin-left: auto; font-size: 0.75rem; color: #475569; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    .card.alerta { border-color: #ef4444; }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .device-name { font-size: 1rem; font-weight: 600; }
    .device-id { font-size: 0.72rem; color: #64748b; margin-top: 2px; }
    .last-seen { font-size: 0.72rem; color: #64748b; text-align: right; }
    .last-seen.stale { color: #ef4444; }
    .metrics { display: flex; flex-direction: column; gap: 14px; }
    .metric-label { font-size: 0.72rem; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
    .bat-bar-bg { height: 8px; background: #334155; border-radius: 4px; overflow: hidden; }
    .bat-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
    .bat-value { font-size: 0.82rem; font-weight: 600; margin-top: 5px; }
    .rssi-bars { display: flex; align-items: flex-end; gap: 3px; height: 24px; }
    .rssi-bar { width: 8px; border-radius: 2px; background: #334155; }
    .rssi-value { font-size: 0.82rem; font-weight: 600; margin-left: 8px; }
    .row-metric { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; }
    .row-metric .val { font-weight: 600; }
    .warn { color: #f59e0b; }
    .danger { color: #ef4444; }
    .ok { color: #22c55e; }
    .no-data { font-size: 0.78rem; color: #475569; padding: 4px 0; }
    .temp-note { font-size: 0.65rem; color: #475569; margin-top: 3px; }
    .divider { height: 1px; background: #1e293b; border-top: 1px solid #334155; margin: 2px 0; }
    #loading { text-align: center; color: #64748b; padding: 48px; }
    #error-msg { color: #ef4444; text-align: center; padding: 48px; display: none; }
    /* Sessões de teste */
    .test-section { margin-top: 40px; }
    .test-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    .test-title { font-size: 1rem; font-weight: 600; color: #e2e8f0; }
    .test-subtitle { font-size: 0.75rem; color: #64748b; margin-top: 2px; }
    .date-nav { display: flex; align-items: center; gap: 8px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 5px 12px; }
    .date-nav button { background: none; border: none; color: #cbd5e1; cursor: pointer; font-size: 16px; padding: 0 4px; line-height: 1; }
    .date-nav button:disabled { color: #334155; cursor: default; }
    .date-nav input[type=date] { background: transparent; border: none; color: #cbd5e1; font-size: 13px; font-weight: 600; outline: none; cursor: pointer; }
    .date-nav input[type=date]::-webkit-calendar-picker-indicator { filter: invert(0.6); cursor: pointer; }
    .btn-hoje { background: #ea580c; border: none; color: #fff; font-size: 11px; font-weight: 600; border-radius: 5px; padding: 3px 8px; cursor: pointer; }
    .test-table-wrap { background: #1e293b; border: 1px solid #334155; border-radius: 12px; overflow: hidden; }
    .test-table-meta { padding: 14px 20px 10px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .test-table-meta span { font-size: 12px; color: #64748b; }
    .btn-reload { background: transparent; border: 1px solid #334155; color: #94a3b8; font-size: 11px; border-radius: 6px; padding: 3px 10px; cursor: pointer; }
    .test-table { width: 100%; border-collapse: collapse; }
    .test-table th { padding: 10px 20px; text-align: left; font-size: 10px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.07em; border-bottom: 1px solid #334155; background: #162032; }
    .test-table td { padding: 11px 20px; font-size: 13px; border-bottom: 1px solid #1a2a3a; color: #cbd5e1; }
    .test-table tr:last-child td { border-bottom: none; }
    .test-table tr:hover td { background: #243447; }
    .dev-badge { display: inline-block; background: #0f172a; border: 1px solid #334155; border-radius: 5px; padding: 2px 7px; font-size: 11px; font-family: monospace; color: #94a3b8; }
    .lora-badge { background: #0ea5e9; color: #fff; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px; letter-spacing: 0.05em; margin-left: 4px; }
    .dur-val { font-weight: 700; color: #e2e8f0; }
    .empty-row { padding: 32px; text-align: center; color: #475569; font-size: 13px; }
  </style>
</head>
<body>

<header>
  <a href="/">← Dashboard</a>
  <div>
    <h1>🔧 Diagnóstico de Dispositivos</h1>
    <div class="subtitle">Dados da última sessão transmitida por cada device</div>
  </div>
  <div id="refresh-info">Atualizando...</div>
</header>

<div id="loading">Carregando...</div>
<div id="error-msg"></div>
<div class="grid" id="grid" style="display:none"></div>

<div class="test-section" id="test-section" style="display:none">
  <div class="test-header">
    <div>
      <div class="test-title">🧪 Sessões dos Dispositivos em Teste</div>
      <div class="test-subtitle">device_005 (Esteira B) · device_006 (LoRa) — dados brutos sem filtragem de anomalias</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <div class="date-nav">
        <button id="btn-prev">‹</button>
        <input type="date" id="date-picker" />
        <button id="btn-next" disabled>›</button>
      </div>
      <button class="btn-hoje" id="btn-hoje" style="display:none">Hoje</button>
      <button class="btn-reload" id="btn-reload">↺ Atualizar</button>
    </div>
  </div>
  <div class="test-table-wrap">
    <div class="test-table-meta">
      <span id="test-meta">—</span>
    </div>
    <div id="test-table-body"></div>
  </div>
</div>

<script>
const API = 'https://gymtracker-api-production-bc16.up.railway.app';

// Devices que aparecem nos cards de hardware
const CARD_DEVICES = {
  device_001: 'Leg Press',
  device_002: 'Pulley',
  device_003: 'Supino Máquina',
  device_006: 'LoRa — Device 006',
};

// Devices que aparecem na tabela de sessões de teste
const TESTE_DEVICES = {
  device_005: 'Esteira B',
  device_006: 'LoRa — Device 006',
};

const LIMITE_ANOMALIA_TESTE = {
  device_005: 14400, // esteira: 4h
  device_006: 3600,
};

function parseBRT(str) {
  if (!str) return null;
  if (/Z$|[+-]\d{2}:\d{2}$/.test(str)) return new Date(str);
  return new Date(str + '-03:00');
}

function tempoDesde(str) {
  var d = parseBRT(str);
  if (!d || isNaN(d.getTime())) return '—';
  var diff = Math.max(0, Math.floor((Date.now() - d) / 1000));
  if (diff < 60) return diff + 's atrás';
  if (diff < 3600) return Math.floor(diff / 60) + 'min atrás';
  var h = Math.floor(diff / 3600);
  var m = Math.floor((diff % 3600) / 60);
  return m > 0 ? h + 'h ' + m + 'min atrás' : h + 'h atrás';
}

function isStale(str, limitMin) {
  var lim = limitMin || 120;
  var d = parseBRT(str);
  if (!d || isNaN(d.getTime())) return false;
  return (Date.now() - d) / 60000 > lim;
}

function batCor(pct) {
  if (pct > 50) return '#22c55e';
  if (pct > 20) return '#f59e0b';
  return '#ef4444';
}

function rssiQualidade(rssi) {
  if (rssi === null || rssi === undefined) return { label: '—', cls: '' };
  if (rssi >= -55) return { label: 'Excelente', cls: 'ok' };
  if (rssi >= -70) return { label: 'Bom', cls: 'ok' };
  if (rssi >= -80) return { label: 'Fraco', cls: 'warn' };
  return { label: 'Crítico', cls: 'danger' };
}

function rssiBarras(rssi) {
  var degraus = [{ min: -90, h: 6 }, { min: -80, h: 11 }, { min: -70, h: 16 }, { min: -55, h: 21 }];
  return degraus.map(function(d) {
    var ativo = rssi !== null && rssi !== undefined && rssi >= d.min;
    var cor = '#334155';
    if (ativo) cor = rssi >= -70 ? '#22c55e' : rssi >= -80 ? '#f59e0b' : '#ef4444';
    return '<div class="rssi-bar" style="height:' + d.h + 'px;background:' + cor + '"></div>';
  }).join('');
}

function tempCls(t) {
  if (t === null || t === undefined) return '';
  if (t > 80) return 'danger';
  if (t > 65) return 'warn';
  return 'ok';
}

function na(val, suf) {
  return (val !== null && val !== undefined) ? val + (suf || '') : '—';
}

function renderCard(d) {
  var nome = CARD_DEVICES[d.device_id] || d.device_id;
  var isLora = d.device_id === 'device_006';
  var stale = isStale(d.ultimo_contato, 120);
  var batBaixa = d.bat_pct !== null && d.bat_pct !== undefined && d.bat_pct > 0 && d.bat_pct <= 15;
  var alertaCard = stale || batBaixa;
  var rq = rssiQualidade(d.rssi);
  var wsmCls = d.wakes_sem_mov > 50 ? 'warn' : '';
  var bufCls = d.buffer_fill > 18 ? 'danger' : d.buffer_fill > 10 ? 'warn' : '';
  var batHtml = (d.bat_pct !== null && d.bat_pct !== undefined && d.bat_pct > 0)
    ? '<div class="bat-bar-bg"><div class="bat-bar-fill" style="width:' + d.bat_pct + '%;background:' + batCor(d.bat_pct) + '"></div></div><div class="bat-value" style="color:' + batCor(d.bat_pct) + '">' + d.bat_pct + '%</div>'
    : '<div class="no-data">sem dados (firmware sem leitura de bateria)</div>';
  var rssiLabel = isLora ? 'RSSI (WiFi do Gateway)' : 'Sinal WiFi';

  return '<div class="card ' + (alertaCard ? 'alerta' : '') + '">'
    + '<div class="card-header"><div>'
    + '<div class="device-name">' + nome + (isLora ? ' <span class="lora-badge">LoRa</span>' : '') + '</div>'
    + '<div class="device-id">' + d.device_id + '</div>'
    + '</div><div class="last-seen ' + (stale ? 'stale' : '') + '">'
    + (stale ? '⚠️ ' : '') + tempoDesde(d.ultimo_contato)
    + '</div></div>'
    + '<div class="metrics">'
    + '<div><div class="metric-label">🔋 Bateria</div>' + batHtml + '</div>'
    + '<div class="divider"></div>'
    + '<div><div class="metric-label">📶 ' + rssiLabel + '</div>'
    + '<div style="display:flex;align-items:center;gap:8px">'
    + '<div class="rssi-bars">' + rssiBarras(d.rssi) + '</div>'
    + (d.rssi !== null && d.rssi !== undefined
        ? '<span class="rssi-value ' + rq.cls + '">' + d.rssi + ' dBm</span><span style="font-size:.78rem;color:#64748b">' + rq.label + '</span>'
        : '<span class="rssi-value" style="color:#475569">sem dados</span>')
    + '</div></div>'
    + '<div class="divider"></div>'
    + '<div><div class="metric-label">🌡️ Temperatura Interna (chip)</div>'
    + '<div class="row-metric"><span class="val ' + tempCls(d.temp_c) + '">' + na(d.temp_c, ' °C') + '</span>'
    + (d.temp_c > 80 ? '<span class="danger">⚠️ Superaquecimento</span>' : d.temp_c > 65 ? '<span class="warn">Elevada</span>' : d.temp_c !== null ? '<span class="ok">Normal</span>' : '')
    + '</div><div class="temp-note">Temperatura interna do ESP32 — não representa o ambiente</div></div>'
    + '<div class="divider"></div>'
    + '<div class="row-metric"><span>Wakes sem movimento</span><span class="val ' + wsmCls + '">' + na(d.wakes_sem_mov) + '</span></div>'
    + '<div class="row-metric"><span>Buffer (sessões pendentes)</span><span class="val ' + bufCls + '">' + na(d.buffer_fill, ' / 20') + '</span></div>'
    + '</div></div>';
}

// ── Tabela de sessões de teste ────────────────────────────────────────────────

function toYMD(d) { return d.toLocaleDateString('sv-SE'); }
function addDaysD(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
function isTodayD(d) { return toYMD(d) === toYMD(new Date()); }

function fmtDurT(s) {
  if (s === null || s === undefined || s < 0) return '—';
  if (s < 60) return s + 's';
  var m = Math.floor(s / 60);
  if (m < 60) return m + 'min ' + (s % 60) + 's';
  return Math.floor(m / 60) + 'h ' + (m % 60) + 'min';
}

function fmtDtHoraT(str) {
  var d = parseBRT(str);
  if (!d || isNaN(d.getTime())) return '—';
  var hora = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  if (isTodayD(d)) return 'Hoje ' + hora;
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ' + hora;
}

var selectedDateTeste = new Date();

function updateDateUI() {
  var picker = document.getElementById('date-picker');
  var btnNext = document.getElementById('btn-next');
  var btnHoje = document.getElementById('btn-hoje');
  if (picker) picker.value = toYMD(selectedDateTeste);
  if (btnNext) btnNext.disabled = isTodayD(selectedDateTeste);
  if (btnHoje) btnHoje.style.display = isTodayD(selectedDateTeste) ? 'none' : 'inline-block';
}

function carregarSessoesTeste(date) {
  var ymd = toYMD(date);
  var meta = document.getElementById('test-meta');
  var body = document.getElementById('test-table-body');
  if (meta) meta.textContent = 'Carregando...';
  if (body) body.innerHTML = '';

  fetch(API + '/sessoes/dia?data=' + ymd)
    .then(function(r) { return r.json(); })
    .then(function(raw) {
      var arr = (Array.isArray(raw) ? raw : raw.sessoes || [])
        .filter(function(s) { return TESTE_DEVICES[s.device_id]; })
        .sort(function(a, b) { return new Date(b.inicio) - new Date(a.inicio); });

      var label = isTodayD(date) ? 'Hoje'
        : date.toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' });
      if (meta) meta.textContent = arr.length + ' sessão' + (arr.length !== 1 ? 'ões' : '') + ' — ' + label + ' — dados brutos';

      if (!arr.length) {
        if (body) body.innerHTML = '<div class="empty-row">Nenhuma sessão neste dia para os dispositivos em teste.</div>';
        return;
      }

      var rows = arr.map(function(s) {
        var nome = TESTE_DEVICES[s.device_id] || s.device_id;
        var dur = s.duracao_segundos !== undefined ? s.duracao_segundos : s.duracao;
        var limite = LIMITE_ANOMALIA_TESTE[s.device_id] || 3600;
        var isAnom = dur && dur > limite;
        var batHtml = (s.bat_pct !== null && s.bat_pct !== undefined && s.bat_pct > 0)
          ? '<span style="color:' + (s.bat_pct > 50 ? '#22c55e' : s.bat_pct > 20 ? '#f59e0b' : '#ef4444') + ';font-weight:600">' + s.bat_pct + '%</span>'
          : '<span style="color:#475569">—</span>';
        var rssiHtml = (s.rssi !== null && s.rssi !== undefined)
          ? '<span style="color:#94a3b8">' + s.rssi + ' dBm</span>'
          : '<span style="color:#475569">—</span>';
        return '<tr' + (isAnom ? ' title="Duração acima do limite para este device"' : '') + '>'
          + '<td><span style="color:#e2e8f0;font-weight:600">' + nome + '</span></td>'
          + '<td>' + fmtDtHoraT(s.inicio) + '</td>'
          + '<td>' + fmtDtHoraT(s.fim) + '</td>'
          + '<td><span class="dur-val' + (isAnom ? ' warn' : '') + '">' + fmtDurT(dur) + (isAnom ? ' ⚠️' : '') + '</span></td>'
          + '<td>' + batHtml + '</td>'
          + '<td>' + rssiHtml + '</td>'
          + '<td><span class="dev-badge">' + s.device_id + '</span></td>'
          + '</tr>';
      }).join('');

      if (body) body.innerHTML = '<table class="test-table"><thead><tr>'
        + '<th>Dispositivo</th><th>Início</th><th>Fim</th>'
        + '<th>Duração</th><th>Bateria</th><th>RSSI</th><th>Device ID</th>'
        + '</tr></thead><tbody>' + rows + '</tbody></table>';
    })
    .catch(function(e) {
      if (meta) meta.textContent = 'Erro: ' + e.message;
    });
}

function initTabelaTeste() {
  updateDateUI();
  carregarSessoesTeste(selectedDateTeste);

  document.getElementById('btn-prev').addEventListener('click', function() {
    selectedDateTeste = addDaysD(selectedDateTeste, -1);
    updateDateUI(); carregarSessoesTeste(selectedDateTeste);
  });
  document.getElementById('btn-next').addEventListener('click', function() {
    if (!isTodayD(selectedDateTeste)) {
      selectedDateTeste = addDaysD(selectedDateTeste, 1);
      updateDateUI(); carregarSessoesTeste(selectedDateTeste);
    }
  });
  document.getElementById('btn-hoje').addEventListener('click', function() {
    selectedDateTeste = new Date();
    updateDateUI(); carregarSessoesTeste(selectedDateTeste);
  });
  document.getElementById('date-picker').addEventListener('change', function(e) {
    var d = new Date(e.target.value + 'T12:00:00');
    if (!isNaN(d)) { selectedDateTeste = d; updateDateUI(); carregarSessoesTeste(selectedDateTeste); }
  });
  document.getElementById('btn-reload').addEventListener('click', function() {
    carregarSessoesTeste(selectedDateTeste);
  });
  setInterval(function() {
    if (isTodayD(selectedDateTeste)) carregarSessoesTeste(selectedDateTeste);
  }, 30000);
}

// ── Fetch cards ───────────────────────────────────────────────────────────────

function carregar() {
  fetch(API + '/dispositivos/status', { signal: AbortSignal.timeout(10000) })
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(data) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-msg').style.display = 'none';
      var grid = document.getElementById('grid');
      grid.style.display = 'grid';

      // Filtra apenas devices dos cards (produção + LoRa)
      var cardData = data.filter(function(d) { return CARD_DEVICES[d.device_id]; });
      grid.innerHTML = cardData.length
        ? cardData.map(renderCard).join('')
        : '<p style="color:#475569;grid-column:1/-1;text-align:center">Nenhum device encontrado.</p>';

      var testSection = document.getElementById('test-section');
      if (testSection && testSection.style.display === 'none') {
        testSection.style.display = 'block';
        initTabelaTeste();
      }
      var agora = new Date().toLocaleTimeString('pt-BR');
      document.getElementById('refresh-info').textContent = 'Atualizado às ' + agora;
    })
    .catch(function(e) {
      document.getElementById('loading').style.display = 'none';
      var el = document.getElementById('error-msg');
      el.style.display = 'block';
      el.textContent = 'Erro ao carregar: ' + e.message;
    });
}

carregar();
setInterval(carregar, 30000);
</script>
</body>
</html>
