<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GymTracker — Diagnóstico</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 24px 16px; }
    header { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
    header a { color: #64748b; text-decoration: none; font-size: .85rem; border: 1px solid #334155; padding: 4px 10px; border-radius: 6px; }
    header a:hover { color: #cbd5e1; }
    h1 { font-size: 1.25rem; font-weight: 600; }
    .subtitle { color: #64748b; font-size: .8rem; margin-top: 2px; }
    #refresh-info { margin-left: auto; font-size: .75rem; color: #475569; }

    .section-label { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: #475569; margin: 28px 0 12px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    .card.alerta { border-color: #ef4444; }
    .card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
    .device-name { font-size: 1rem; font-weight: 600; }
    .device-id { font-size: .72rem; color: #64748b; margin-top: 2px; }
    .last-seen { font-size: .72rem; color: #64748b; text-align: right; }
    .last-seen.stale { color: #ef4444; }

    /* Heartbeat */
    .heartbeat-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #334155; margin-bottom: 10px; }
    .heart { font-size: 20px; display: inline-block; }
    .heart.alive { animation: pulse 1.4s ease infinite; }
    .heart.hibernate { font-size: 20px; }
    .heart-label { font-size: .82rem; font-weight: 600; }
    .heart-label.alive { color: #22c55e; }
    .heart-label.dead { color: #ef4444; }
    .heart-label.hibernate { color: #94a3b8; }
    .heart-sub { font-size: .7rem; color: #64748b; margin-top: 1px; }
    @keyframes pulse {
      0%,100% { transform: scale(1); }
      14%      { transform: scale(1.25); }
      28%      { transform: scale(1); }
      42%      { transform: scale(1.15); }
      56%      { transform: scale(1); }
    }

    .metrics { display: flex; flex-direction: column; gap: 14px; }
    .metric-label { font-size: .72rem; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .05em; }
    .bat-bar-bg { height: 8px; background: #334155; border-radius: 4px; overflow: hidden; }
    .bat-bar-fill { height: 100%; border-radius: 4px; transition: width .5s ease; }
    .bat-value { font-size: .82rem; font-weight: 600; margin-top: 5px; }
    .rssi-bars { display: flex; align-items: flex-end; gap: 3px; height: 24px; }
    .rssi-bar { width: 8px; border-radius: 2px; background: #334155; }
    .rssi-value { font-size: .82rem; font-weight: 600; margin-left: 8px; }
    .row-metric { display: flex; justify-content: space-between; align-items: center; font-size: .82rem; }
    .row-metric .val { font-weight: 600; }
    .warn { color: #f59e0b; } .danger { color: #ef4444; } .ok { color: #22c55e; }
    .no-data { font-size: .78rem; color: #475569; padding: 4px 0; }
    .temp-note { font-size: .65rem; color: #475569; margin-top: 3px; }
    .divider { border-top: 1px solid #334155; margin: 2px 0; }
    .lora-badge { background: #0ea5e9; color: #fff; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px; letter-spacing: .05em; margin-left: 4px; }

    #loading { text-align: center; color: #64748b; padding: 48px; }
    #error-msg { color: #ef4444; text-align: center; padding: 48px; display: none; }

    /* Tabela de teste */
    .test-section { margin-top: 40px; }
    .test-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    .test-title { font-size: 1rem; font-weight: 600; }
    .test-subtitle { font-size: .75rem; color: #64748b; margin-top: 2px; }
    .date-nav { display: flex; align-items: center; gap: 8px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 5px 12px; }
    .date-nav button { background: none; border: none; color: #cbd5e1; cursor: pointer; font-size: 16px; padding: 0 4px; line-height: 1; }
    .date-nav button:disabled { color: #334155; cursor: default; }
    .date-nav input[type=date] { background: transparent; border: none; color: #cbd5e1; font-size: 13px; font-weight: 600; outline: none; cursor: pointer; }
    .date-nav input[type=date]::-webkit-calendar-picker-indicator { filter: invert(.6); cursor: pointer; }
    .btn-hoje { background: #ea580c; border: none; color: #fff; font-size: 11px; font-weight: 600; border-radius: 5px; padding: 3px 8px; cursor: pointer; }
    .test-table-wrap { background: #1e293b; border: 1px solid #334155; border-radius: 12px; overflow: hidden; }
    .test-table-meta { padding: 14px 20px 10px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .test-table-meta span { font-size: 12px; color: #64748b; }
    .btn-reload { background: transparent; border: 1px solid #334155; color: #94a3b8; font-size: 11px; border-radius: 6px; padding: 3px 10px; cursor: pointer; }
    .test-table { width: 100%; border-collapse: collapse; }
    .test-table th { padding: 10px 20px; text-align: left; font-size: 10px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: .07em; border-bottom: 1px solid #334155; background: #162032; }
    .test-table td { padding: 11px 20px; font-size: 13px; border-bottom: 1px solid #1a2a3a; color: #cbd5e1; }
    .test-table tr:last-child td { border-bottom: none; }
    .test-table tr:hover td { background: #243447; }
    .dev-badge { display: inline-block; background: #0f172a; border: 1px solid #334155; border-radius: 5px; padding: 2px 7px; font-size: 11px; font-family: monospace; color: #94a3b8; }
    .hb-badge { display: inline-block; background: #1e3a2f; border: 1px solid #22c55e44; border-radius: 5px; padding: 1px 7px; font-size: 10px; color: #22c55e; }
    .dur-val { font-weight: 700; }
    .empty-row { padding: 32px; text-align: center; color: #475569; font-size: 13px; }
  </style>
</head>
<body>

<header>
  <a href="/">← Dashboard</a>
  <div>
    <h1>🔧 Diagnóstico de Dispositivos</h1>
    <div class="subtitle">Dados da última sessão transmitida por cada device</div>
  </div>
  <div id="refresh-info">Atualizando...</div>
</header>

<div id="loading">Carregando...</div>
<div id="error-msg"></div>

<div id="prod-section" style="display:none">
  <div class="section-label">Devices de Produção</div>
  <div class="grid" id="grid-prod"></div>
  <div class="section-label" style="margin-top:32px">Devices em Teste</div>
  <div class="grid" id="grid-teste"></div>
</div>

<div class="test-section" id="test-section" style="display:none">
  <div class="test-header">
    <div>
      <div class="test-title">🧪 Sessões dos Dispositivos em Teste</div>
      <div class="test-subtitle">device_006 (LoRa) · device_007 · device_008 — dados brutos, heartbeats incluídos</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <div class="date-nav">
        <button id="btn-prev">‹</button>
        <input type="date" id="date-picker" />
        <button id="btn-next" disabled>›</button>
      </div>
      <button class="btn-hoje" id="btn-hoje" style="display:none">Hoje</button>
      <button class="btn-reload" id="btn-reload">↺ Atualizar</button>
    </div>
  </div>
  <div class="test-table-wrap">
    <div class="test-table-meta"><span id="test-meta">—</span></div>
    <div id="test-table-body"></div>
  </div>
</div>

<script>
var API = 'https://gymtracker-api-production-bc16.up.railway.app';

// Cards de produção (só hardware info, sem heartbeat)
var PROD_DEVICES = {
  device_001: 'Leg Press',
  device_002: 'Pulley',
  device_003: 'Supino Máquina',
  device_005: 'Esteira B',
};

// Cards de teste (com heartbeat)
var TESTE_CARD_DEVICES = {
  device_006: { nome: 'LoRa — Device 006', isLora: true,  hbMin: 5,  hibernacao: false },
  device_007: { nome: 'Device 007',        isLora: false, hbMin: 70, hibernacao: true  },
  device_008: { nome: 'Device 008',        isLora: false, hbMin: 70, hibernacao: true  },
};

// Tabela de sessões de teste
var TESTE_TABLE_DEVICES = {
  device_005: 'Esteira B',
  device_006: 'LoRa — Device 006',
  device_007: 'Device 007',
  device_008: 'Device 008',
};

var LIMITE_ANOMALIA_TESTE = { device_005: 14400, device_006: 3600, device_007: 3600, device_008: 3600 };

function parseBRT(str) {
  if (!str) return null;
  if (/Z$|[+-]\d{2}:\d{2}$/.test(str)) return new Date(str);
  return new Date(str + '-03:00');
}

function horaBRT() {
  return new Date(Date.now() - 3 * 3600000).getUTCHours();
}

function tempoDesde(str) {
  var d = parseBRT(str);
  if (!d || isNaN(d.getTime())) return '—';
  var diff = Math.max(0, Math.floor((Date.now() - d) / 1000));
  if (diff < 60) return diff + 's atrás';
  if (diff < 3600) return Math.floor(diff / 60) + 'min atrás';
  var h = Math.floor(diff / 3600), m = Math.floor((diff % 3600) / 60);
  return m > 0 ? h + 'h ' + m + 'min atrás' : h + 'h atrás';
}

function isStale(str, limitMin) {
  var d = parseBRT(str);
  if (!d || isNaN(d.getTime())) return false;
  return (Date.now() - d) / 60000 > (limitMin || 120);
}

function batCor(p) { return p > 50 ? '#22c55e' : p > 20 ? '#f59e0b' : '#ef4444'; }

function rssiBarras(rssi) {
  var dg = [{min:-90,h:6},{min:-80,h:11},{min:-70,h:16},{min:-55,h:21}];
  return dg.map(function(d) {
    var a = rssi !== null && rssi !== undefined && rssi >= d.min;
    var c = a ? (rssi >= -70 ? '#22c55e' : rssi >= -80 ? '#f59e0b' : '#ef4444') : '#334155';
    return '<div class="rssi-bar" style="height:' + d.h + 'px;background:' + c + '"></div>';
  }).join('');
}

function rssiLabel(rssi) {
  if (rssi === null || rssi === undefined) return {l:'—', c:''};
  if (rssi >= -55) return {l:'Excelente', c:'ok'};
  if (rssi >= -70) return {l:'Bom', c:'ok'};
  if (rssi >= -80) return {l:'Fraco', c:'warn'};
  return {l:'Crítico', c:'danger'};
}

function tempCls(t) {
  if (!t && t !== 0) return '';
  return t > 80 ? 'danger' : t > 65 ? 'warn' : 'ok';
}

function na(v, s) { return (v !== null && v !== undefined) ? v + (s||'') : '—'; }

// ── Heartbeat ──────────────────────────────────────────────────────────────

function renderHeartbeat(cfg, ultimoContato) {
  var d = parseBRT(ultimoContato);
  if (!d || isNaN(d.getTime())) {
    return '<div class="heartbeat-row"><span class="heart">🩶</span><div><div class="heart-label dead">Sem dados</div><div class="heart-sub">Nenhum heartbeat recebido ainda</div></div></div>';
  }
  var diffMin = (Date.now() - d) / 60000;
  var h = horaBRT();

  // Hibernação (007 e 008 das 00h às 06h)
  if (cfg.hibernacao && h >= 0 && h < 6) {
    return '<div class="heartbeat-row"><span class="heart hibernate">🐻</span><div><div class="heart-label hibernate">Hibernando</div><div class="heart-sub">Janela 00h–06h · acorda às 06h</div></div></div>';
  }

  var alive = diffMin <= cfg.hbMin;
  if (alive) {
    var mins = Math.round(diffMin);
    return '<div class="heartbeat-row"><span class="heart alive">💚</span><div><div class="heart-label alive">Operacional</div><div class="heart-sub">Último heartbeat ' + (mins < 1 ? 'agora mesmo' : mins + 'min atrás') + ' · próximo em ~' + cfg.hbMin + 'min</div></div></div>';
  } else {
    return '<div class="heartbeat-row"><span class="heart">🩶</span><div><div class="heart-label dead">Precisa de atenção</div><div class="heart-sub">Sem heartbeat há ' + Math.round(diffMin) + 'min · esperado a cada ' + cfg.hbMin + 'min</div></div></div>';
  }
}

// ── Cards ──────────────────────────────────────────────────────────────────

function batHtml(pct) {
  if (pct !== null && pct !== undefined && pct >= 0) {
    return '<div class="bat-bar-bg"><div class="bat-bar-fill" style="width:' + pct + '%;background:' + batCor(pct) + '"></div></div><div class="bat-value" style="color:' + batCor(pct) + '">' + pct + '%</div>';
  }
  return '<div class="no-data">sem dados (firmware sem leitura de bateria)</div>';
}

function rssiHtml(rssi, label) {
  var rl = rssiLabel(rssi);
  return '<div style="display:flex;align-items:center;gap:8px"><div class="rssi-bars">' + rssiBarras(rssi) + '</div>'
    + (rssi !== null && rssi !== undefined
      ? '<span class="rssi-value ' + rl.c + '">' + rssi + ' dBm</span><span style="font-size:.78rem;color:#64748b">' + rl.l + '</span>'
      : '<span class="rssi-value" style="color:#475569">sem dados</span>')
    + '</div>';
}

function metricsHtml(d, rssiLabel) {
  var wsmCls = d.wakes_sem_mov > 50 ? 'warn' : '';
  var bufCls = d.buffer_fill > 18 ? 'danger' : d.buffer_fill > 10 ? 'warn' : '';
  var tCls   = tempCls(d.temp_c);
  return '<div class="metrics">'
    + '<div><div class="metric-label">🔋 Bateria</div>' + batHtml(d.bat_pct) + '</div>'
    + '<div class="divider"></div>'
    + '<div><div class="metric-label">📶 ' + rssiLabel + '</div>' + rssiHtml(d.rssi) + '</div>'
    + '<div class="divider"></div>'
    + '<div><div class="metric-label">🌡️ Temperatura Interna (chip)</div>'
    + '<div class="row-metric"><span class="val ' + tCls + '">' + na(d.temp_c, ' °C') + '</span>'
    + (d.temp_c > 80 ? '<span class="danger">⚠️ Superaquecimento</span>' : d.temp_c > 65 ? '<span class="warn">Elevada</span>' : d.temp_c ? '<span class="ok">Normal</span>' : '')
    + '</div><div class="no-data" style="margin-top:3px">Temperatura interna do ESP32 — não representa o ambiente</div></div>'
    + '<div class="divider"></div>'
    + '<div class="row-metric"><span>Wakes sem movimento</span><span class="val ' + wsmCls + '">' + na(d.wakes_sem_mov) + '</span></div>'
    + '<div class="row-metric"><span>Buffer (sessões pendentes)</span><span class="val ' + bufCls + '">' + na(d.buffer_fill, ' / 20') + '</span></div>'
    + '</div>';
}

function renderProdCard(d) {
  var nome  = PROD_DEVICES[d.device_id] || d.device_id;
  var stale = isStale(d.ultimo_contato, 120);
  var batBaixa = d.bat_pct > 0 && d.bat_pct <= 15;
  return '<div class="card ' + (stale || batBaixa ? 'alerta' : '') + '">'
    + '<div class="card-header"><div>'
    + '<div class="device-name">' + nome + '</div>'
    + '<div class="device-id">' + d.device_id + '</div>'
    + '</div><div class="last-seen ' + (stale ? 'stale' : '') + '">' + (stale ? '⚠️ ' : '') + tempoDesde(d.ultimo_contato) + '</div></div>'
    + metricsHtml(d, 'Sinal WiFi')
    + '</div>';
}

function renderTesteCard(d) {
  var cfg = TESTE_CARD_DEVICES[d.device_id];
  if (!cfg) return '';
  var stale = isStale(d.ultimo_contato, cfg.hbMin * 3);
  var batBaixa = d.bat_pct > 0 && d.bat_pct <= 15;
  var alertaCard = batBaixa || (isStale(d.ultimo_contato, cfg.hbMin) && !isHibernating(cfg));
  return '<div class="card ' + (alertaCard ? 'alerta' : '') + '">'
    + '<div class="card-header"><div>'
    + '<div class="device-name">' + cfg.nome + (cfg.isLora ? ' <span class="lora-badge">LoRa</span>' : '') + '</div>'
    + '<div class="device-id">' + d.device_id + '</div>'
    + '</div><div class="last-seen ' + (stale ? 'stale' : '') + '">' + tempoDesde(d.ultimo_contato) + '</div></div>'
    + renderHeartbeat(cfg, d.ultimo_contato)
    + metricsHtml(d, cfg.isLora ? 'RSSI (WiFi do Gateway)' : 'Sinal WiFi')
    + '</div>';
}

function isHibernating(cfg) {
  if (!cfg.hibernacao) return false;
  var h = horaBRT();
  return h >= 0 && h < 6;
}

// ── Tabela de sessões de teste ─────────────────────────────────────────────

function toYMD(d) { return d.toLocaleDateString('sv-SE'); }
function addDaysD(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
function isTodayD(d) { return toYMD(d) === toYMD(new Date()); }

function fmtDurT(s) {
  if (s === null || s === undefined) return '—';
  if (s === 0) return '<span class="hb-badge">💓 heartbeat</span>';
  if (s < 60) return s + 's';
  var m = Math.floor(s / 60);
  if (m < 60) return m + 'min ' + (s % 60) + 's';
  return Math.floor(m / 60) + 'h ' + (m % 60) + 'min';
}

function fmtDtHoraT(str) {
  var d = parseBRT(str);
  if (!d || isNaN(d.getTime())) return '—';
  var hora = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  return isTodayD(d) ? 'Hoje ' + hora : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ' + hora;
}

var selectedDateTeste = new Date();

function updateDateUI() {
  var picker = document.getElementById('date-picker');
  var btnNext = document.getElementById('btn-next');
  var btnHoje = document.getElementById('btn-hoje');
  if (picker) picker.value = toYMD(selectedDateTeste);
  if (btnNext) btnNext.disabled = isTodayD(selectedDateTeste);
  if (btnHoje) btnHoje.style.display = isTodayD(selectedDateTeste) ? 'none' : 'inline-block';
}

function carregarSessoesTeste(date) {
  var ymd = toYMD(date);
  var meta = document.getElementById('test-meta');
  var body = document.getElementById('test-table-body');
  if (meta) meta.textContent = 'Carregando...';
  if (body) body.innerHTML = '';

  fetch(API + '/sessoes/dia?data=' + ymd)
    .then(function(r) { return r.json(); })
    .then(function(raw) {
      var arr = (Array.isArray(raw) ? raw : raw.sessoes || [])
        .filter(function(s) { return TESTE_TABLE_DEVICES[s.device_id]; })
        .sort(function(a, b) { return new Date(b.inicio) - new Date(a.inicio); });

      var label = isTodayD(date) ? 'Hoje'
        : date.toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' });
      if (meta) meta.textContent = arr.length + ' registros — ' + label + ' (sessões + heartbeats)';

      if (!arr.length) {
        if (body) body.innerHTML = '<div class="empty-row">Nenhum registro neste dia para os dispositivos em teste.</div>';
        return;
      }

      var rows = arr.map(function(s) {
        var nome = TESTE_TABLE_DEVICES[s.device_id] || s.device_id;
        var dur = s.duracao_segundos !== undefined ? s.duracao_segundos : s.duracao;
        var limite = LIMITE_ANOMALIA_TESTE[s.device_id] || 3600;
        var isHb   = dur === 0;
        var isAnom = !isHb && dur && dur > limite;
        var batH = (s.bat_pct !== null && s.bat_pct !== undefined && s.bat_pct > 0)
          ? '<span style="color:' + (s.bat_pct > 50 ? '#22c55e' : s.bat_pct > 20 ? '#f59e0b' : '#ef4444') + ';font-weight:600">' + s.bat_pct + '%</span>'
          : '<span style="color:#475569">—</span>';
        var rssiH = (s.rssi !== null && s.rssi !== undefined)
          ? '<span style="color:#94a3b8">' + s.rssi + ' dBm</span>'
          : '<span style="color:#475569">—</span>';
        return '<tr style="' + (isHb ? 'opacity:.65' : '') + '">'
          + '<td><span style="font-weight:600">' + nome + '</span></td>'
          + '<td>' + fmtDtHoraT(s.inicio) + '</td>'
          + '<td>' + fmtDtHoraT(s.fim) + '</td>'
          + '<td><span class="dur-val' + (isAnom ? ' warn' : '') + '">' + fmtDurT(dur) + (isAnom ? ' ⚠️' : '') + '</span></td>'
          + '<td>' + batH + '</td>'
          + '<td>' + rssiH + '</td>'
          + '<td><span class="dev-badge">' + s.device_id + '</span></td>'
          + '</tr>';
      }).join('');

      if (body) body.innerHTML = '<table class="test-table"><thead><tr>'
        + '<th>Dispositivo</th><th>Início</th><th>Fim</th>'
        + '<th>Duração</th><th>Bateria</th><th>RSSI</th><th>Device ID</th>'
        + '</tr></thead><tbody>' + rows + '</tbody></table>';
    })
    .catch(function(e) { if (meta) meta.textContent = 'Erro: ' + e.message; });
}

function initTabelaTeste() {
  updateDateUI();
  carregarSessoesTeste(selectedDateTeste);
  document.getElementById('btn-prev').addEventListener('click', function() {
    selectedDateTeste = addDaysD(selectedDateTeste, -1);
    updateDateUI(); carregarSessoesTeste(selectedDateTeste);
  });
  document.getElementById('btn-next').addEventListener('click', function() {
    if (!isTodayD(selectedDateTeste)) { selectedDateTeste = addDaysD(selectedDateTeste, 1); updateDateUI(); carregarSessoesTeste(selectedDateTeste); }
  });
  document.getElementById('btn-hoje').addEventListener('click', function() {
    selectedDateTeste = new Date(); updateDateUI(); carregarSessoesTeste(selectedDateTeste);
  });
  document.getElementById('date-picker').addEventListener('change', function(e) {
    var d = new Date(e.target.value + 'T12:00:00');
    if (!isNaN(d)) { selectedDateTeste = d; updateDateUI(); carregarSessoesTeste(selectedDateTeste); }
  });
  document.getElementById('btn-reload').addEventListener('click', function() { carregarSessoesTeste(selectedDateTeste); });
  setInterval(function() { if (isTodayD(selectedDateTeste)) carregarSessoesTeste(selectedDateTeste); }, 30000);
}

// ── Fetch principal ────────────────────────────────────────────────────────

function carregar() {
  fetch(API + '/dispositivos/status', { signal: AbortSignal.timeout(10000) })
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(data) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-msg').style.display = 'none';
      document.getElementById('prod-section').style.display = 'block';

      var prodData  = data.filter(function(d) { return PROD_DEVICES[d.device_id]; });
      var testeData = data.filter(function(d) { return TESTE_CARD_DEVICES[d.device_id]; });

      document.getElementById('grid-prod').innerHTML  = prodData.length  ? prodData.map(renderProdCard).join('')   : '<p style="color:#475569">Nenhum device de produção encontrado.</p>';
      document.getElementById('grid-teste').innerHTML = testeData.length ? testeData.map(renderTesteCard).join('') : '<p style="color:#475569">Nenhum device em teste encontrado.</p>';

      var testSection = document.getElementById('test-section');
      if (testSection && testSection.style.display === 'none') {
        testSection.style.display = 'block';
        initTabelaTeste();
      }
      document.getElementById('refresh-info').textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR');
    })
    .catch(function(e) {
      document.getElementById('loading').style.display = 'none';
      var el = document.getElementById('error-msg');
      el.style.display = 'block';
      el.textContent = 'Erro ao carregar: ' + e.message;
    });
}

carregar();
setInterval(carregar, 30000);
</script>
